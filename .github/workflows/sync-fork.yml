name: Sync Fork with Upstream

on:
  schedule:
    - cron: '0 0 * * *' # 每天 UTC 0 点（北京时间早上 8 点）自动运行
  workflow_dispatch: # 允许你在 Actions 页面手动点击运行

jobs:
  sync:
    runs-on: ubuntu-latest
    # 仅在 Fork 仓库中运行（防止在原仓库误触发）
    if: github.event.repository.fork == true
    steps:
      - name: Sync upstream changes
        uses: aormsby/Fork-Sync-With-Upstream-action@v3.4.3
        with:
          target_sync_branch: doc-zh # 你的 Fork 要同步的分支名
          target_repo_token: ${{ secrets.GITHUB_TOKEN }}
          upstream_sync_repo: hankcs/HanLP # 替换为原作者/仓库名，例如 octocat/Hello-World
          upstream_sync_branch: doc-zh # 上游原仓库的分支名
